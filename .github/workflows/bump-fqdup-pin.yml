name: Bump fqdup libtaph pin

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fqdup
        uses: actions/checkout@v4
        with:
          repository: genomewalker/fqdup
          token: ${{ secrets.FQDUP_PAT }}

      - name: Update libtaph GIT_TAG in CMakeLists.txt
        run: |
          NEW_SHA="${GITHUB_SHA::7}"
          sed -i "s/GIT_TAG        [0-9a-f]\{7\}/GIT_TAG        ${NEW_SHA}/" CMakeLists.txt
          grep "GIT_TAG" CMakeLists.txt | grep libtaph -A1 || grep -A1 "libtaph" CMakeLists.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "cmake: bump libtaph pin to ${GITHUB_SHA::7}"
          git push
